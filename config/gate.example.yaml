# Fully worked example of a Gate configuration.
#
# This file is a reference, not the file Gate reads. On first start the
# container writes a minimal config/gate.yaml (mounted at
# /app/config/gate.yaml) if none exists; copy from here to grow it.

server:
  host: 0.0.0.0
  port: 6473
  max_body_size: 1MB
  upstream_timeout: 30s

  # Who may set X-Forwarded-*. Default false: the client address comes from the
  # socket and client-sent X-Forwarded-* are ignored. Behind cloudflared, set
  # this to that container's address or subnet so the real client IP survives
  # without letting every peer forge one.
  # trust_proxy: "172.18.0.0/16"

logging:
  level: info

jwt:
  algorithm: RS256

  # Generated on first start if missing. Point these at /app/keys/… instead to
  # manage the pair on the host and mount ./keys read-only.
  public_key: /data/keys/jwt_public.pem
  private_key: /data/keys/jwt_private.pem

  issuer: homelab-gateway

  audience:
    - homelab

  # Reject tokens with no exp claim. Gate has no revocation list, so an
  # expiry-less token cannot be invalidated without rotating the key pair.
  require_expiry: true

mapping:
  enabled: true

token_log:
  path: /data/tokens.jsonl

services:
  grafana-main:
    url: http://grafana:3000

  n8n:
    url: http://n8n:5678

  node-red:
    url: http://node-red:1880

  fallback:
    url: http://fallback:6473

routes:
  - target: grafana
    service: grafana-main

  - target: n8n
    mapping:
      path:
        strip_prefix: /n8n/

  - target: node-red
    auth: false

  - fallback:
      service: fallback
