services:
  gate:
    build: .
    image: homelab-gate:latest
    container_name: gate
    restart: unless-stopped

    # Gate never publishes a port on the host. It is reachable only through the
    # internal Docker networks — cloudflared connects to http://gate:8080.

    environment:
      GATE_CONFIG: /app/config/gate.yaml
      GATE_ISSUED_BY: ${GATE_ISSUED_BY:-}
      # Gate runs as this user. The entrypoint chowns /data to it first, so a
      # bind-mounted data directory created by Docker as root:root still works.
      PUID: ${UID:-1000}
      PGID: ${GID:-1000}
      # On first start, write config/gate.yaml if it is missing and generate the
      # JWT key pair into the gate-data volume. Nothing existing is overwritten.
      GATE_BOOTSTRAP: "true"

    volumes:
      # Writable so the first start can drop a default gate.yaml here for you to
      # edit. Add :ro once you manage the file yourself. If the directory is not
      # writable for uid 1000, Gate falls back to /data/gate.yaml in the volume
      # rather than failing to start.
      - ./volumes/gate/config:/app/config
      # Holds the token log and, unless you point jwt.* elsewhere, the keys.
      - ./volumes/gate/data:/data

    # Allow the container to reach the host machine by hostname when the app
    # needs to call services running on the host OS, such as local dev APIs.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - gateway
      - services

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    depends_on:
      - gate
    networks:
      - gateway

  # Catch-all upstream for requests Gate cannot route.
  fallback:
    image: traefik/whoami
    container_name: gate-fallback
    restart: unless-stopped
    command: ["--port", "8080"]
    networks:
      - services

  # Upstreams referenced by config/gate.yaml live on the `services` network:
  #
  # n8n:
  #   image: docker.n8n.io/n8nio/n8n
  #   networks: [services]
  #
  # grafana:
  #   image: grafana/grafana
  #   networks: [services]
  #
  # node-red:
  #   image: nodered/node-red
  #   networks: [services]

networks:
  gateway:
  services:
